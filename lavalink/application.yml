server:
  port: ${SERVER_PORT:2333}
  address: 0.0.0.0
  http2:
    enabled: false

plugins:
  youtube:
    enabled: true
    allowSearch: true
    allowDirectVideoIds: true
    allowDirectPlaylistIds: true
    clients:
      - MUSIC
      - ANDROID_VR
      - WEB
      - WEBEMBEDDED
  lavasrc:
    providers:
      - 'ytsearch:"%ISRC%"'
      - "ytsearch:%QUERY%"
    sources:
      spotify: true
      applemusic: true
      deezer: false
      youtube: false
    spotify:
      clientId: ${SPOTIFY_CLIENT_ID:}
      clientSecret: ${SPOTIFY_CLIENT_SECRET:}
      countryCode: "IN"
    applemusic:
      countryCode: "IN"
      mediaAPIToken: ${APPLE_MUSIC_API_TOKEN:}
    youtube:
      countryCode: "IN"
      language: "en"

lavalink:
  plugins:
    - dependency: "dev.lavalink.youtube:youtube-plugin:1.18.2"
    - dependency: "com.github.topi314.lavasrc:lavasrc-plugin:4.7.3"
  server:
    password: ${LAVALINK_SERVER_PASSWORD}
    sources:
      youtube: false
      bandcamp: true
      soundcloud: true
      twitch: true
      vimeo: true
      nico: false
      http: true
      local: false
    filters:
      volume: true
      equalizer: true
      karaoke: true
      timescale: true
      tremolo: true
      vibrato: true
      distortion: true
      rotation: true
      channelMix: true
      lowPass: true
    bufferDurationMs: 400
    frameBufferDurationMs: 5000
    opusEncodingQuality: 8
    resamplingQuality: LOW
    trackStuckThresholdMs: 10000
    useSeekGhosting: true
    soundcloudSearchEnabled: true

logging:
  level:
    root: INFO
    lavalink: INFO
  request:
    enabled: false

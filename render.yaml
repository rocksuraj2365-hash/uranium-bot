services:
  - type: web
    name: uranium-web
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /health
    envVars:
      - key: DISCORD_CLIENT_ID
        sync: false
      - key: DISCORD_CLIENT_SECRET
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: PUBLIC_BASE_URL
        sync: false
  - type: web
    name: uranium-bot
    runtime: node
    plan: free
    healthCheckPath: /health
    buildCommand: npm install
    startCommand: node bot.js
    envVars:
      - key: DISCORD_CLIENT_ID
        sync: false
      - key: DISCORD_BOT_TOKEN
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: AI_MODEL
        sync: false

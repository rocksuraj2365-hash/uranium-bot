services:
  - type: web
    name: uranium-web
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /health
    envVars:
      - key: DISCORD_CLIENT_ID
        sync: false
      - key: DISCORD_CLIENT_SECRET
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: SESSION_DATABASE_URL
        sync: false
      - key: PUBLIC_BASE_URL
        sync: false
  - type: web
    name: uranium-bot
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: node bot.js
    healthCheckPath: /health
    envVars:
      - key: DISCORD_CLIENT_ID
        sync: false
      - key: DISCORD_BOT_TOKEN
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: AI_MODEL
        value: gemini-3.8-flash
      - key: AI_FALLBACK_MODELS
        value: gemini-3.7-flash,gemini-3.5-flash-lite
      - key: OWNER_IDS
        sync: false
      - key: OWNER_TOTP_SECRET
        sync: false
      - key: GITHUB_TOKEN
        sync: false
      - key: RENDER_API_KEY
        sync: false
      - key: LAVALINK_HOST
        sync: false
      - key: LAVALINK_PORT
        value: "443"
      - key: LAVALINK_PASSWORD
        sync: false
      - key: LAVALINK_SECURE
        value: "true"

  - type: web
    name: uranium-lavalink
    runtime: docker
    plan: free
    dockerfilePath: ./lavalink/Dockerfile
    healthCheckPath: /version
    envVars:
      - key: SERVER_PORT
        value: "10000"
      - key: SERVER_ADDRESS
        value: "0.0.0.0"
      - key: _JAVA_OPTIONS
        value: "-Xms128M -Xmx320M -XX:+UseG1GC"
      - key: LAVALINK_SERVER_PASSWORD
        sync: false
      - key: SPOTIFY_CLIENT_ID
        sync: false
      - key: SPOTIFY_CLIENT_SECRET
        sync: false
      - key: APPLE_MUSIC_API_TOKEN
        sync: false
